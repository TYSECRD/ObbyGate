apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obbygate-ai-ingress
  namespace: obbygate
spec:
  podSelector:
    matchLabels:
      app: obbygate-ai
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          podSelector:
            matchLabels:
              app: obbygate
      ports:
        - protocol: TCP
          port: 8000